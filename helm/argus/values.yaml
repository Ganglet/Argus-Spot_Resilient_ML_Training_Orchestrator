image:
  repository: 844641713781.dkr.ecr.eu-north-1.amazonaws.com/argus/operator
  tag: latest
  pullPolicy: IfNotPresent

operator:
  pollIntervalSeconds: 60
  # 0.65 was the old default and never fires — the real model's calibrated risk
  # scores top out around 0.0018 on held-out data (see docs/week7_model_evaluation.md),
  # so 0.65 silently disabled the predictive path entirely. 0.0015 is the model's
  # own best-F1 threshold (10.7% recall, 63 alarms on the test set) — tune lower
  # for more recall at the cost of more checkpoint overhead, see the threshold
  # table in that doc before changing this.
  riskThreshold: 0.0015
  predictServiceUrl: http://argus-predict-service:8000

metrics:
  # Port the operator's Prometheus client serves on (metrics.py start_http_server).
  port: 8080

aws:
  region: eu-north-1
  checkpointBucket: argus-checkpoints-844641713781
  riskEventsQueueUrl: https://sqs.eu-north-1.amazonaws.com/844641713781/argus-risk-events

serviceAccount:
  name: argus-operator
  irsaRoleArn: arn:aws:iam::844641713781:role/argus-operator-irsa

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
