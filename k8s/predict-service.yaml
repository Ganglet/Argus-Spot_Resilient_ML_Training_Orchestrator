apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-predict-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-predict-service
  template:
    metadata:
      labels:
        app: argus-predict-service
    spec:
      containers:
        - name: predict-service
          image: argus/predict-service:latest
          imagePullPolicy: Never          # use Minikube's local image registry
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/model.pt
            - name: MOCK_MODE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: argus-predict-service
  namespace: default
spec:
  selector:
    app: argus-predict-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
